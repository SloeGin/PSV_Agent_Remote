# Mosquitto 2.x: hooks on this machine use plain 1883 on localhost only; the PSV
# reaches the broker over the LAN on 8883 with TLS-PSK.
#   sudo cp mosquitto.psk /etc/mosquitto/psv.psk
#   sudo chown mosquitto: /etc/mosquitto/psv.psk && sudo chmod 600 /etc/mosquitto/psv.psk
#   sudo cp tools/mosquitto-psk.conf /etc/mosquitto/conf.d/psv-agent-remote.conf
#   sudo systemctl restart mosquitto
# Remove any other "listener 1883" without an address from the main config.

per_listener_settings true

listener 1883 127.0.0.1
allow_anonymous true

listener 8883
psk_hint psv-agent-remote
psk_file /etc/mosquitto/psv.psk
use_identity_as_username true
tls_version tlsv1.2
